services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenant_provisioner
      POSTGRES_USER: tenant_user
      POSTGRES_PASSWORD: tenant_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgresql+psycopg://tenant_user:tenant_password@postgres:5432/tenant_provisioner
      APP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: INFO
    command: ["/app/scripts/compose-entrypoint.sh", "python", "-m", "alembic", "upgrade", "head"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_DATABASE_URL: postgresql+psycopg://tenant_user:tenant_password@postgres:5432/tenant_provisioner
      APP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    command: ["/app/scripts/compose-entrypoint.sh", "python", "-m", "app.control_plane.api.main"]

  progress-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_DATABASE_URL: postgresql+psycopg://tenant_user:tenant_password@postgres:5432/tenant_provisioner
      APP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: INFO
    command: ["/app/scripts/compose-entrypoint.sh", "python", "-m", "app.control_plane.consumers.worker_progress"]

  outbox-publisher:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_DATABASE_URL: postgresql+psycopg://tenant_user:tenant_password@postgres:5432/tenant_provisioner
      APP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: INFO
    command: ["/app/scripts/compose-entrypoint.sh", "python", "-m", "app.outbox_publisher.publisher"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      APP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: INFO
    command:
      [
        "/app/scripts/compose-entrypoint.sh",
        "python",
        "-m",
        "app.worker.simulator",
        "--fail-rate",
        "0.0",
        "--min-delay-ms",
        "250",
        "--max-delay-ms",
        "750",
      ]

volumes:
  postgres_data:
